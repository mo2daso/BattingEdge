services:
  - type: web
    name: battingedge-backend
    env: python
    region: singapore   # closest to Pakistan
    plan: starter       # $7/mo — recommended for ML workloads (512MB free tier often too small)
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true           # Render auto-generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: GMAIL_ADDRESS
        sync: false                   # Set manually in Render dashboard
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false                   # Set to your Vercel URL e.g. https://battingedge.vercel.app
    healthCheckPath: /api/health
    autoDeploy: true
